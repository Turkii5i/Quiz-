<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Story Dictation</title>
<style>
:root{--bg:#f3f8f8;--surface:#fff;--surface2:#f7fbfb;--text:#183637;--muted:#718283;--accent:#2f8587;--accent2:#e0f2f2;--dark:#173d3f;--border:#d8e8e8;--gold:#fff3cd;--goldBorder:#ead79b}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#e7f3f3,#f8fbfa 48%,#edf6f6);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:780px;margin:auto;padding:16px 12px 42px}
.hero{text-align:center;padding:8px 4px 12px}
.logo{width:58px;height:58px;margin:auto auto 10px;border-radius:18px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900}
h1{margin:0;color:var(--dark);font-size:29px}
.subtitle{margin:4px 0 0;color:var(--muted);font-size:15px}
.card{background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:26px;padding:18px;margin:12px 0;box-shadow:0 10px 28px rgba(24,62,64,.07)}
.topline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge{background:var(--accent2);color:var(--accent);font-weight:900;border-radius:999px;padding:8px 13px}
.progress{height:8px;background:#e4eeee;border-radius:99px;overflow:hidden;margin:14px 0 2px}
.bar{height:100%;width:0;background:var(--accent);transition:width .2s}
.title{font-size:18px;font-weight:900;color:var(--dark);margin:4px 0 10px}
.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--border);background:var(--surface2);color:var(--text);border-radius:18px;padding:12px;text-align:right;min-height:70px;font:inherit;cursor:pointer}
.mode strong{display:block;font-size:16px}.mode small{display:block;color:var(--muted);margin-top:2px}
.mode.active{border-color:var(--accent);background:var(--accent2)}
label{display:flex;justify-content:space-between;color:var(--dark);font-weight:850;margin:15px 0 6px}
input[type=range]{width:100%;min-height:42px;accent-color:var(--accent)}
select{width:100%;min-height:48px;border:2px solid var(--border);border-radius:15px;background:#fff;color:var(--text);font-size:16px;padding:8px}
.listen{background:var(--dark);color:#fff;border-radius:23px;padding:18px;margin-top:16px}
.listenMeta{display:flex;justify-content:space-between;color:#cbe0e0;font-size:13px}
.current{direction:ltr;text-align:left;font-size:25px;font-weight:800;line-height:1.45;min-height:88px;display:flex;align-items:center;padding:10px 0}
.pause{background:var(--gold);border:1px solid var(--goldBorder);color:#675719;border-radius:15px;padding:9px;text-align:center;font-weight:900}
button.action{width:100%;min-height:52px;border:0;border-radius:17px;margin-top:10px;font-size:18px;font-weight:900;background:var(--accent);color:#fff}
button.action.secondary{background:#e7f0f0;color:var(--dark)}
button.action:disabled{opacity:.45}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.review{direction:ltr;text-align:left;background:var(--surface2);border:2px solid var(--border);border-radius:19px;padding:16px;font-size:20px;line-height:1.65}
.status{text-align:center;color:#d8eeee;font-size:14px;margin-top:9px;font-weight:700}
.note{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
@media(max-width:480px){.modeGrid{grid-template-columns:1fr}.current{font-size:22px}.card{padding:15px}h1{font-size:27px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div class="logo">A</div><h1>English Story Dictation</h1><p class="subtitle">استمع واكتب ثم راجع الجملة كاملة</p></header>

<section class="card">
<div class="topline"><div class="badge" id="counter"></div><div class="badge" id="modeBadge"></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div class="title">اختر طريقة الاستماع</div>
<div class="modeGrid">
<button class="mode active" id="segMode" type="button"><strong>تقسيم إلى أجزاء</strong><small>يوقف بعد كل جزء للكتابة</small></button>
<button class="mode" id="fullMode" type="button"><strong>المقطع كامل</strong><small>يقرأ الجملة كاملة دون توقف</small></button>
</div>

<label for="speed"><span>سرعة النطق</span><span id="speedValue">1.00×</span></label>
<input id="speed" type="range" min="0.50" max="1.50" step="0.05" value="1">

<label for="delay"><span>مدة التوقف بين الأجزاء</span><span id="delayValue">10 ثوانٍ</span></label>
<input id="delay" type="range" min="3" max="20" step="1" value="10">

<label for="voice"><span>الصوت الإنجليزي</span></label>
<select id="voice"><option value="-1">الصوت التلقائي في الجهاز</option></select>

<div class="listen">
<div class="listenMeta"><span id="listenLabel">الجزء الحالي</span><span id="chunkProgress"></span></div>
<div class="current" id="current"></div>
<div class="pause" id="pauseBox" hidden>توقف للكتابة: <span id="pauseCount">10</span> ثوانٍ</div>
<button class="action" id="play" type="button">▶ تشغيل</button>
<button class="action secondary" id="replay" type="button">↻ إعادة تشغيل</button>
<div class="status" id="status"></div>
</div>

<div class="nav">
<button class="action secondary" id="prev" type="button">→ السابق</button>
<button class="action secondary" id="next" type="button">التالي ←</button>
</div>
</section>

<section class="card">
<div class="title">الجملة الكاملة للمراجعة</div>
<div class="review" id="review"></div>
<div class="note">اكتب ما تسمعه أولًا، ثم استخدم هذه الجملة للمقارنة.</div>
</section>
</main>

<script>
(() => {
const story=["When the two children got back to the tunnel with the men from the farm, they found Bobbie and Jim asleep.", "The men carried Jim on a piece of flat wood.", "'Where does he live?' asked one of them.", "'In Northumberland,' answered Bobbie.", "'He told me while we were waiting.'", "'I'm at a school in Maidbridge,' said Jim, 'I suppose I must get back there.'", "'A doctor ought to see you first,' said the man.", "'Bring him to our house,' said Bobbie.", "'It's not far along the road.", "I'm sure Mother will say it's all right.'", "Mother did say it was all right, although she was a little surprised at first.", "Then Bobbie explained.", "I'm sorry to be so much trouble,' Jim said to Mother as the men carried him in.", "His face was white with pain.", "'Don't worry, you poor dear,\" said Mother.", "'You must go to bed, and I'll send for Doctor Forrest.\"", "Mother also sent a message to Jim's school, to tell them what had happened.", "'My grandfather lives near here,' said Jim. 'Then I'll write and tell him, too,' said Mother.", "'I'm sure he'll want to know.", "What's his name?'", "After breakfast the next day, someone knocked at the front door.", "'That will be the doctor again,' said Mother.", "She went out of the kitchen and closed the door.", "But it wasn't the doctor.", "The children listened as Mother and the visitor went upstairs.", "They heard them talking, and were sure that they knew the voice of the visitor.", "But who was it?", "After a while, the bedroom door opened and they heard Mother and the visitor come down and go into the front room of the house.", "Then they heard Mother calling: 'Bobbie!'", "Mother was in the hall.", "\"Jim's grandfather has come,' she said.", "'He wants to see you all.'", "They followed Mother into the other room, and there sat - THEIR OWN OLD GENTLEMAN.", "'Oh, it's you!' cried Bobbie.", "'How wonderful!' said Peter.", "'But you're not going to take Jim away, are you? I was hoping he could stay.!", "The old gentleman smiled.", "'No,' he said.", "'Your mother is very kind.", "She has agreed to let Jim stay here.", "I thought of sending a nurse, but your mother was good enough to agree to be his nurse herself.'", "'But what about her writing?' said Peter, before anyone could stop him.", "'There won't be anything for him to eat if she doesn't write.!", "The old gentleman smiled kindly at Mother.", "'She has agreed to stop her writing for a while, and become Head Nurse of my hospital.", "'Oh!' said Phyllis.", "'Will we have to go away from the white house, and the railway and everything?'", "'No, no, darling,' Mother said quickly.", "'The hospital is here, at this house.'", "'And my unlucky Jim is the only one needing a nurse,' said the old gentleman.", "'But there will be a maid and someone to cook the meals until Jim is well.'", "\"Will we have to go away from the white house, and the railway and everything?'", "'No, no, darling,' Mother said quickly.", "'The hospital is here, at this house.'", "\"And my unlucky Jim is the only one needing a nurse,' said the old gentleman.", "'But there will be a maid and someone to cook the meals until Jim is well.'", "'Then will Mother start writing again?' asked Peter.", "'Perhaps something nice will happen, and she won't have to,' said the old gentleman.", "'Take care of your mother, my dears.", "She's a woman in a million.", "Now, perhaps Bobbie can take me to the door?'", "The two of them went outside, and the old gentleman said, 'I got your letter, my child, but it wasn't necessary.", "When I read about your father in the newspapers at the time, I began trying to find out things.", "I haven't done much yet, but I have hopes, my dear - I have hopes.'", "'Oh!' said Bobbie, crying a little.", "'But keep your secret a little longer,' he said.", "'You don't think Father did it, do you?' said Bobbie.", "'Oh, say you don't!\"", "\"I'm sure he didn't,' said the old gentleman."];
let index=0, mode="segments", voices=[], timer=null, stopped=false;
const $=id=>document.getElementById(id);
const counter=$("counter"),modeBadge=$("modeBadge"),bar=$("bar"),segMode=$("segMode"),fullMode=$("fullMode");
const speed=$("speed"),speedValue=$("speedValue"),delay=$("delay"),delayValue=$("delayValue"),voice=$("voice");
const current=$("current"),review=$("review"),play=$("play"),replay=$("replay"),prev=$("prev"),next=$("next");
const status=$("status"),pauseBox=$("pauseBox"),pauseCount=$("pauseCount"),listenLabel=$("listenLabel"),chunkProgress=$("chunkProgress");

function chunksOf(s){
  const words=s.trim().split(/\s+/), a=[]; let i=0;
  while(i<words.length){let take=Math.min(5,words.length-i), rem=words.length-i; if(rem>5&&rem-take<3)take=Math.ceil(rem/2); a.push(words.slice(i,i+take).join(" ")); i+=take;}
  return a;
}
function render(){
  clearTimeout(timer); if("speechSynthesis" in window)speechSynthesis.cancel();
  const s=story[index], cs=chunksOf(s);
  counter.textContent=`الجملة ${index+1} من ${story.length}`;
  modeBadge.textContent=mode==="segments"?"تقسيم إلى أجزاء":"المقطع كامل";
  review.textContent=s; bar.style.width=`${((index+1)/story.length)*100}%`;
  prev.disabled=index===0; next.disabled=index===story.length-1; pauseBox.hidden=true;
  if(mode==="segments"){current.textContent=cs[0]||s;listenLabel.textContent="الجزء الحالي";chunkProgress.textContent=`1 / ${cs.length}`;status.textContent="سيقرأ الجزء ثم يتوقف للكتابة."}
  else{current.textContent=s;listenLabel.textContent="المقطع الحالي";chunkProgress.textContent="1 / 1";status.textContent="سيقرأ الجملة كاملة دون توقف."}
}
function setMode(m){stop();mode=m;segMode.classList.toggle("active",m==="segments");fullMode.classList.toggle("active",m==="full");render()}
function loadVoices(){
  if(!("speechSynthesis" in window))return;
  voices=speechSynthesis.getVoices().filter(v=>/^en(-|$)/i.test(v.lang));
  voice.innerHTML=""; const auto=document.createElement("option");auto.value="-1";auto.textContent="الصوت التلقائي في الجهاز";voice.appendChild(auto);
  voices.forEach((v,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=`${v.name} — ${v.lang}`;voice.appendChild(o)});
  const p=voices.findIndex(v=>/Samantha|Karen|Daniel|Alex|Google US English|Microsoft.*English/i.test(v.name));if(p>=0)voice.value=String(p);
}
function speak(text){
  return new Promise(resolve=>{
    if(stopped)return resolve();
    const u=new SpeechSynthesisUtterance(text);u.rate=Number(speed.value);u.pitch=1;
    const vi=Number(voice.value);if(voices[vi]){u.voice=voices[vi];u.lang=voices[vi].lang}else u.lang="en-US";
    u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u);
  });
}
async function playCurrent(){
  if(!("speechSynthesis" in window)){status.textContent="النطق الصوتي غير متاح. افتح الصفحة في Safari.";return}
  stop();stopped=false;play.disabled=true;replay.disabled=true;prev.disabled=true;next.disabled=true;
  const s=story[index],cs=chunksOf(s);
  if(mode==="full"){current.textContent=s;chunkProgress.textContent="1 / 1";status.textContent="جارٍ قراءة المقطع كاملًا...";await speak(s)}
  else{
    for(let i=0;i<cs.length&&!stopped;i++){
      current.textContent=cs[i];chunkProgress.textContent=`${i+1} / ${cs.length}`;status.textContent=`استمع واكتب الجزء ${i+1} من ${cs.length}`;
      await speak(cs[i]);if(stopped)break;
      if(i<cs.length-1){
        let left=Number(delay.value);pauseBox.hidden=false;pauseCount.textContent=left;
        await new Promise(resolve=>{const tick=()=>{if(stopped)return resolve();left--;pauseCount.textContent=Math.max(left,0);if(left<=0){pauseBox.hidden=true;resolve()}else timer=setTimeout(tick,1000)};timer=setTimeout(tick,1000)});
      }
    }
  }
  play.disabled=false;replay.disabled=false;prev.disabled=index===0;next.disabled=index===story.length-1;
  if(!stopped){current.textContent=s;status.textContent="انتهى التشغيل. اضغط التالي للجملة التالية."}
}
function stop(){stopped=true;clearTimeout(timer);pauseBox.hidden=true;if("speechSynthesis" in window)speechSynthesis.cancel();play.disabled=false;replay.disabled=false;prev.disabled=index===0;next.disabled=index===story.length-1}
speed.addEventListener("input",()=>speedValue.textContent=Number(speed.value).toFixed(2)+"×");
delay.addEventListener("input",()=>delayValue.textContent=delay.value+" ثوانٍ");
segMode.addEventListener("click",()=>setMode("segments"));fullMode.addEventListener("click",()=>setMode("full"));
play.addEventListener("click",playCurrent);replay.addEventListener("click",playCurrent);
prev.addEventListener("click",()=>{stop();if(index>0){index--;render()}});
next.addEventListener("click",()=>{stop();if(index<story.length-1){index++;render()}});
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
render();
})();
</script>
</body>
</html>
